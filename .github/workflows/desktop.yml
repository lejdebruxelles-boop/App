# Builds the Windows installer (.exe + .appx for the Microsoft Store) and the macOS .dmg.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
name: Desktop builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: macos-latest
            cmd: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mozaik-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.appx
            release/*.dmg
