# Builds the Windows installer (.exe + .appx for the Microsoft Store) and the macOS .dmg.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
name: Desktop builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: macos-latest
            cmd: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mozaik-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.appx
            release/*.dmg
