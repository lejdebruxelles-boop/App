name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests (moteur, sauvegarde, traductions, sécurité)
        run: npm test
      - name: Build (avec Content-Security-Policy)
        run: npm run build
      - name: Audit des dépendances livrées aux joueurs
        run: npm audit --omit=dev --audit-level=moderate
